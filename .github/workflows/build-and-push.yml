name: Build and Push MayoueBeauty509

on:
  push:
    branches:
      - main
    paths:
      - 'application/**'
      - 'VERSION'
      - '.github/workflows/build-and-push.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./application
          file: ./application/Dockerfile
          push: true
          tags: |
            pmchamblain/mayouebeauty509-app:${{ steps.version.outputs.VERSION }}
            pmchamblain/mayouebeauty509-app:${{ github.sha }}
            pmchamblain/mayouebeauty509-app:latest

      - name: Update GitOps repository
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/MaxCH114/MayoueBeauty509-GitOps.git gitops

          cd gitops

          sed -i "s|image: pmchamblain/mayouebeauty509-app:.*|image: pmchamblain/mayouebeauty509-app:${IMAGE_TAG}|" k8s/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          git diff --cached --quiet || git commit -m "Deploy MayoueBeauty509 ${IMAGE_TAG}"

          git push origin main
